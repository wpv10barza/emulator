name: Ubuntu emulator and upstream validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-evidence:
    name: Emulator, contract and figure evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout emulator repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run unit and integration tests
        run: |
          mkdir -p artifacts
          npm test 2>&1 | tee artifacts/node-tests.log

      - name: Verify credentials are not tracked
        run: |
          if git ls-files | grep -Ei '(^|/)(service-account|credentials?|folkloric-drive).*\.json$'; then
            echo "Se detectó un archivo de credenciales versionado." >&2
            exit 1
          fi

      - name: Generate Ubuntu terminal and screen evidence
        run: npm run evidence 2>&1 | tee artifacts/evidence-command.log

      - name: Export thesis PNG files at 300 dpi
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin
          mkdir -p artifacts/screens-png
          for source in artifacts/screens/*.svg; do
            target="artifacts/screens-png/$(basename "${source%.svg}.png")"
            rsvg-convert --dpi-x 300 --dpi-y 300 "$source" -o "$target"
          done
          file artifacts/screens-png/*.png | tee artifacts/png-verification.log

      - name: Record source repository connections
        run: |
          {
            echo "esp32-3C main"
            git ls-remote https://github.com/wpv10barza/esp32-3C.git refs/heads/main
            echo "asistente-3c main"
            git ls-remote https://github.com/wpv10barza/asistente-3c.git refs/heads/main
          } 2>&1 | tee artifacts/upstream-connections.log

      - name: Upload emulator evidence
        uses: actions/upload-artifact@v4.6.2
        with:
          name: esp32-4848s040-emulator-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  upstream-builds:
    name: Pinned backend and panel builds
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout emulator repository
        uses: actions/checkout@v7
        with:
          path: emulator

      - name: Checkout pinned Asistente 3C
        uses: actions/checkout@v7
        with:
          repository: wpv10barza/asistente-3c
          ref: 4d323083de83c0618d848ff514607d50bacd8012
          path: asistente-3c

      - name: Checkout pinned ESP32 panel firmware
        uses: actions/checkout@v7
        with:
          repository: wpv10barza/esp32-3C
          ref: 2ebac82166ab8044e0ea8ab1ef0e3bdfe60ad943
          path: esp32-3C

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate and build Asistente 3C
        working-directory: asistente-3c
        run: |
          mkdir -p ../upstream-artifacts
          npm ci
          npm run lint 2>&1 | tee ../upstream-artifacts/asistente-lint.log
          npm test 2>&1 | tee ../upstream-artifacts/asistente-tests.log
          npm run build 2>&1 | tee ../upstream-artifacts/asistente-build.log

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.1.18

      - name: Compile ESP32-S3-4848S040 firmware
        working-directory: esp32-3C
        run: |
          pio run --environment panel_4848s040 2>&1 | tee ../upstream-artifacts/panel-4848s040-build.log
          mkdir -p ../upstream-artifacts/firmware
          cp .pio/build/panel_4848s040/*.bin ../upstream-artifacts/firmware/

      - name: Record pinned revisions
        run: |
          {
            echo "asistente-3c $(git -C asistente-3c rev-parse HEAD)"
            echo "esp32-3C $(git -C esp32-3C rev-parse HEAD)"
          } | tee upstream-artifacts/pinned-revisions.txt

      - name: Upload upstream build evidence
        uses: actions/upload-artifact@v4.6.2
        with:
          name: pinned-upstream-builds
          path: upstream-artifacts/
          if-no-files-found: error
          retention-days: 30
